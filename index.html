<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Binary Halftone</title>
  <style>
    :root {
      --bg: #070b09;
      --panel: #0d1411;
      --panel-border: #1c2a24;
      --ink: #d7ece6;
      --muted: #7e9a92;
      --accent: #40d2eb;
      --accent-dim: #1b6f7c;
      --track: #18241f;
      --danger: #f2f7f5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", Inter, ui-sans-serif, system-ui, sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      grid-template-columns: 320px 1fr;
    }

    aside {
      height: 100vh;
      border-right: 1px solid var(--panel-border);
      background: linear-gradient(180deg, #101815 0%, var(--panel) 40%);
      padding: 22px 20px 28px;
      overflow: auto;
    }

    h1 {
      font-size: 15px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 4px;
    }

    .sub {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      margin-bottom: 22px;
    }

    .row { margin-bottom: 16px; }

    label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 7px;
    }

    label span.value {
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.02em;
      font-family: "JetBrains Mono", Menlo, "Courier New", monospace;
      font-size: 12px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: var(--track);
      border-radius: 99px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      border: 0;
      cursor: pointer;
      box-shadow: 0 0 0 4px rgba(64, 210, 235, 0.12);
    }

    .colors {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .swatch {
      background: #0a100e;
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 10px;
    }

    .swatch span {
      display: block;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .swatch input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 34px;
      border: 0;
      background: transparent;
      cursor: pointer;
      padding: 0;
    }

    .swatch input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .swatch input[type="color"]::-webkit-color-swatch {
      border: 1px solid #2a3f38;
      border-radius: 6px;
    }

    .btns {
      display: grid;
      gap: 8px;
    }

    button, .file-btn {
      appearance: none;
      border: 1px solid var(--panel-border);
      background: #121c18;
      color: var(--ink);
      border-radius: 10px;
      padding: 11px 12px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
      text-align: center;
    }

    button:hover, .file-btn:hover {
      border-color: var(--accent-dim);
      background: #16241f;
    }

    button.primary {
      background: #12343a;
      border-color: #1f5d68;
      color: #bff3fa;
    }

    button.primary:hover {
      background: #164650;
    }

    .file-btn { display: block; }
    #file { display: none; }

    .hint {
      margin-top: 16px;
      font-size: 11px;
      color: #5f7a72;
      line-height: 1.5;
    }

    main {
      position: relative;
      height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1200px 700px at 50% 40%, #0c1713 0%, #050807 70%);
      padding: 28px;
    }

    .stage {
      position: relative;
      width: min(100%, calc(100vh - 56px));
      height: min(100%, calc(100vh - 56px));
      display: grid;
      place-items: center;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
      image-rendering: auto;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    .drop {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(7, 16, 12, 0.72);
      color: var(--accent);
      font-size: 18px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      z-index: 5;
      pointer-events: none;
    }

    body.dragging .drop { display: grid; }

    @media (max-width: 860px) {
      body {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr;
        overflow: auto;
      }
      aside {
        height: auto;
        max-height: none;
        border-right: 0;
        border-bottom: 1px solid var(--panel-border);
      }
      main { height: auto; min-height: 70vh; }
    }
  </style>
</head>
<body>
  <aside>
    <h1>Binary Halftone</h1>
    <p class="sub">Luminance-weighted 0/1 matrix. Dark cells stay empty; bright cells grow, glow, and thicken.</p>

    <label class="file-btn" for="file">Upload Image</label>
    <input id="file" type="file" accept="image/*" />

    <div class="row" style="margin-top:18px">
      <label>Grid Density (Columns) <span class="value" id="v-cols">140</span></label>
      <input id="cols" type="range" min="60" max="250" step="1" value="140" />
    </div>
    <div class="row">
      <label>Contrast <span class="value" id="v-contrast">1.40</span></label>
      <input id="contrast" type="range" min="0.5" max="3" step="0.01" value="1.4" />
    </div>
    <div class="row">
      <label>Brightness <span class="value" id="v-brightness">0.00</span></label>
      <input id="brightness" type="range" min="-0.4" max="0.4" step="0.01" value="0" />
    </div>
    <div class="row">
      <label>Shadow Cutoff <span class="value" id="v-threshold">0.15</span></label>
      <input id="threshold" type="range" min="0" max="0.6" step="0.01" value="0.15" />
    </div>
    <div class="row">
      <label>Min Digit Size <span class="value" id="v-minSize">0.42</span></label>
      <input id="minSize" type="range" min="0.15" max="1" step="0.01" value="0.42" />
    </div>
    <div class="row">
      <label>Max Digit Size <span class="value" id="v-maxSize">1.25</span></label>
      <input id="maxSize" type="range" min="0.5" max="1.8" step="0.01" value="1.25" />
    </div>
    <div class="row">
      <label>Glow Intensity <span class="value" id="v-glow">8</span></label>
      <input id="glow" type="range" min="0" max="15" step="1" value="8" />
    </div>

    <div class="colors">
      <label class="swatch">
        <span>Background</span>
        <input id="bg" type="color" value="#07100c" />
      </label>
      <label class="swatch">
        <span>Digit Color</span>
        <input id="fg" type="color" value="#40d2eb" />
      </label>
    </div>

    <div class="btns">
      <button id="reroll" type="button">Re-roll Digits</button>
      <button id="export" class="primary" type="button">Export High-Res PNG</button>
    </div>
    <p class="hint">Drop an image onto the canvas. Seeded 0/1 pattern stays locked until you re-roll. Export renders at 20px per cell.</p>
  </aside>

  <main>
    <div class="stage">
      <canvas id="view"></canvas>
    </div>
    <div class="drop">Drop image to convert</div>
  </main>

    function mulberry32(a) {
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function clamp(n, a, b) {
      return Math.max(a, Math.min(b, n));

    function hexToRgb(hex) {
      const n = parseInt(hex.slice(1), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];

    function mixRgb(a, b, t) {
      return [
        a[0] + (b[0] - a[0]) * t,
        a[1] + (b[1] - a[1]) * t,
        a[2] + (b[2] - a[2]) * t,

      const p = params();
      document.getElementById("v-cols").textContent = String(p.cols);
      document.getElementById("v-contrast").textContent = p.contrast.toFixed(2);
      document.getElementById("v-brightness").textContent = p.brightness.toFixed(2);
      document.getElementById("v-threshold").textContent = p.threshold.toFixed(2);
      document.getElementById("v-minSize").textContent = p.minSize.toFixed(2);
      document.getElementById("v-maxSize").textContent = p.maxSize.toFixed(2);
      document.getElementById("v-glow").textContent = String(p.glow);
    }

    function ensureDigits(cols, rows) {
      if (state.digits && state.digitCols === cols && state.digitRows === rows) return;
      const rand = mulberry32(state.seed);
      const digits = new Uint8Array(cols * rows);
      for (let i = 0; i < digits.length; i++) digits[i] = rand() < 0.5 ? 0 : 1;
      state.digits = digits;
      state.digitCols = cols;
      state.digitRows = rows;
    }

    function rerollDigits() {
      state.seed = (Math.imul(state.seed ^ 0x9e3779b9, 0x85ebca6b) ^ Date.now()) >>> 0;
      state.digits = null;
      paint();
    }

    function sampleLuma(cols, rows) {
      const img = state.image;
      state.sample.width = cols;
      state.sample.height = rows;
      sampleCtx.imageSmoothingEnabled = true;
      sampleCtx.imageSmoothingQuality = "high";
      sampleCtx.clearRect(0, 0, cols, rows);
      sampleCtx.drawImage(img, 0, 0, cols, rows);
      return sampleCtx.getImageData(0, 0, cols, rows).data;
    }

    function adjustedLuma(r, g, b, contrast, brightness) {
      let y = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
      y = clamp((y - 0.5) * contrast + 0.5 + brightness, 0, 1);
      return Math.pow(y, 0.92);
    }

    function renderTo(ctx, width, height, p) {
      const img = state.image;
      const cols = p.cols;
      const rows = Math.max(1, Math.round((cols * img.height) / img.width));
      const cellW = width / cols;
      const cellH = height / rows;
      const cell = Math.min(cellW, cellH);
      const pixels = sampleLuma(cols, rows);
      ensureDigits(cols, rows);

      ctx.save();
      ctx.fillStyle = p.bg;
      ctx.fillRect(0, 0, width, height);
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const fg = hexToRgb(p.fg);
      const hi = mixRgb(fg, [236, 255, 255], 0.62);
      const glowOn = p.glow > 0 && !p.fast;

      for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
          const i = (y * cols + x) * 4;
          const luma = adjustedLuma(pixels[i], pixels[i + 1], pixels[i + 2], p.contrast, p.brightness);
          if (luma <= p.threshold) continue;

          const t = (luma - p.threshold) / (1 - p.threshold || 1);
          const eased = t * t * (3 - 2 * t);
          const sizeMul = p.minSize + (p.maxSize - p.minSize) * Math.pow(t, 0.85);
          const fontPx = Math.max(1.25, cell * sizeMul);
          const alpha = 0.38 + 0.62 * eased;
          const glowT = Math.max(0, (t - 0.5) / 0.5);
          const color = mixRgb(fg, hi, eased * 0.72);
          const weight = Math.round(450 + eased * 450);

          ctx.font = `${weight} ${fontPx}px ${FONT}`;
          ctx.fillStyle = rgba(color, alpha);
          if (glowOn && glowT > 0.08) {
            ctx.shadowColor = rgba(hi, 0.55 + 0.4 * glowT);
            ctx.shadowBlur = p.glow * (0.45 + glowT);
          } else {
            ctx.shadowColor = "transparent";
            ctx.shadowBlur = 0;
          }
          ctx.shadowOffsetX = 0;
          ctx.shadowOffsetY = 0;

          const ch = state.digits[y * cols + x] ? "1" : "0";
          const px = (x + 0.5) * cellW;
          const py = (y + 0.52) * cellH;
          ctx.fillText(ch, px, py);
          if (eased > 0.55) {
            ctx.lineWidth = Math.max(0.4, fontPx * 0.045 * eased);
            ctx.strokeStyle = rgba(color, alpha * 0.55);
            ctx.strokeText(ch, px, py);
          }
        }
      }
      ctx.restore();
    }

    let paintRaf = 0;
    let paintFast = false;

    function paint(fast) {
      if (!state.image) return;
      const p = params();
      p.fast = !!fast;
      const img = state.image;
      const cols = p.cols;
      const rows = Math.max(1, Math.round((cols * img.height) / img.width));

      const stage = document.querySelector(".stage");
      const maxW = stage.clientWidth;
      const maxH = stage.clientHeight;
      const fit = Math.min(maxW / (cols * PREVIEW_CELL), maxH / (rows * PREVIEW_CELL));
      const cssW = Math.max(1, Math.floor(cols * PREVIEW_CELL * fit));
      const cssH = Math.max(1, Math.floor(rows * PREVIEW_CELL * fit));

      els.view.style.width = cssW + "px";
      els.view.style.height = cssH + "px";
      els.view.width = cols * PREVIEW_CELL;
      els.view.height = rows * PREVIEW_CELL;
      viewCtx.setTransform(1, 0, 0, 1, 0, 0);
      renderTo(viewCtx, els.view.width, els.view.height, p);
    }

    function requestPaint(fast) {
      paintFast = fast;
      if (paintRaf) return;
      paintRaf = requestAnimationFrame(() => {
        paintRaf = 0;
        paint(paintFast);
      });
    }

    function exportPng() {
      if (!state.image) return;
      const p = params();
      const cols = p.cols;
      const rows = Math.max(1, Math.round((cols * state.image.height) / state.image.width));
      state.work.width = cols * EXPORT_CELL;
      state.work.height = rows * EXPORT_CELL;
      renderTo(workCtx, state.work.width, state.work.height, p);
      const a = document.createElement("a");
      a.download = "binary-halftone.png";
      a.href = state.work.toDataURL("image/png");
      a.click();
    }

    function loadFile(file) {
      if (!file || !file.type.startsWith("image/")) return;
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        URL.revokeObjectURL(url);
        state.image = img;
        state.digits = null;
        paint();
      };
      img.src = url;
    }

    function loadDefault() {
      const img = new Image();
      img.onload = () => {
        state.image = img;
        paint();
      };
      img.onerror = () => {
        const fallback = new Image();
        fallback.onload = () => {
          state.image = fallback;
          paint();
        };
        fallback.src = "source.jpg";
      };
      img.src = DEFAULT_IMAGE;
    }

    ["cols", "contrast", "brightness", "threshold", "minSize", "maxSize", "glow", "bg", "fg"].forEach((id) => {
      els[id].addEventListener("input", () => {
        syncLabels();
        requestPaint(true);
      });
      els[id].addEventListener("change", () => {
        syncLabels();
        paint(false);
      });
    });

    els.file.addEventListener("change", (e) => loadFile(e.target.files[0]));
    els.reroll.addEventListener("click", rerollDigits);
    els.export.addEventListener("click", exportPng);
    window.addEventListener("resize", paint);

    window.addEventListener("dragover", (e) => {
      e.preventDefault();
      document.body.classList.add("dragging");
    });
    window.addEventListener("dragleave", (e) => {
      if (e.relatedTarget === null) document.body.classList.remove("dragging");
    });
    window.addEventListener("drop", (e) => {
      e.preventDefault();
      document.body.classList.remove("dragging");
      const file = e.dataTransfer.files && e.dataTransfer.files[0];
      loadFile(file);
    });

    syncLabels();
    loadDefault();
  </script>
</body>
</html>
